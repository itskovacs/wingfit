<p-tabs [(value)]="selectedTab">
    <p-tablist>
        <p-tab value="whoop">Whoop</p-tab>
        <p-tab value="applewatch">Apple Watch</p-tab>
    </p-tablist>
    <p-tabpanels>
        <p-tabpanel value="whoop">
            <div class="mt-4 w-full grid">
                <div class="p-3 border-l-4 border-gray-300">The export feature can be found in the
                    Whoop Application, under <span class="font-mono">More > App Settings > Data Export</span></div>

                <div class="mt-4 p-4 mx-auto max-w-screen-xl">
                    <div class="max-w-screen-md text-center">
                        <h2 class="mb-0 text-4xl tracking-tight font-extrabold text-gray-900 dark:text-gray-300">
                            Export file
                        </h2>
                        <div class="p-2 mt-4">
                            <div class="p-1 text-sm text-gray-400">Supports Whoop archive and <i><a
                                        href="https://github.com/karl-cardenas-coding/mywhoop/"
                                        target="_blank">MyWhoop</a></i> json export
                                file.
                            </div>
                            <p-button icon="pi pi-upload" label="Upload" (click)="fileUpload.click()" text
                                severity="secondary" />
                        </div>
                    </div>
                </div>

                <div class="mt-4 p-4 mx-auto max-w-screen-xl">
                    <div class="max-w-screen-md text-center">
                        <h2 class="mb-0 text-4xl tracking-tight font-extrabold text-gray-900 dark:text-gray-300">
                            Export Link
                        </h2>
                        <div class="p-2 mt-4 grid gap-2">
                            <input type="text" pInputText [formControl]="linkInput" placeholder="Whoop URL" />
                            <p-button label="Confirm" [disabled]="!linkInput.value" (click)="linkConfirm()" text />
                        </div>
                    </div>
                </div>
            </div>
        </p-tabpanel>
        <p-tabpanel value="applewatch">
            <div class="mt-4 w-full grid">
                <div class="text-red-500 text-center">Currently, the parser is limited to exports generated by <a
                        href="https://apps.apple.com/fr/app/health-auto-export-json-csv/id1115567069" class="font-bold"
                        target="_blank">Health Auto Export</a> app.</div>

                <div class="mt-4 p-4 mx-auto max-w-screen-xl">
                    <div class="max-w-screen-md text-center">
                        <h2 class="mb-0 text-4xl tracking-tight font-extrabold text-gray-900 dark:text-gray-300">
                            Archive
                        </h2>
                        <div class="p-2 mt-4">
                            <p-button icon="pi pi-upload" label="Upload archive" (click)="fileUpload.click()" text
                                severity="secondary" />
                        </div>
                    </div>
                </div>
            </div>
        </p-tabpanel>
    </p-tabpanels>
</p-tabs>

<input type="file" class="file-input" style="display: none" (change)="onUploadFileSelected($event)" #fileUpload />
